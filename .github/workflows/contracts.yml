name: Contract validation

# Run the complete test suite when contracts, engine code, or tests change.
# This also exercises SQLite migrations and append-only editorial decision records.

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "contracts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate contracts
        run: python -m pytest -q

      - name: Generate live schema-v33 inspection
        run: |
          python -c "from sngso_engine import SQLiteRegistry; registry = SQLiteRegistry('${RUNNER_TEMP}/sngso-schema-v33.sqlite'); registry.close()"
          python -m sngso_engine.schema_inspection "${RUNNER_TEMP}/sngso-schema-v33.sqlite" --output "${RUNNER_TEMP}/schema-v33-inspection.json"
      - name: Upload schema-v33 inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-schema-v33-inspection
          path: ${{ runner.temp }}/schema-v33-inspection.json
          if-no-files-found: error
          retention-days: 14
