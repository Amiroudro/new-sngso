[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "new-sngso-engine"
version = "0.1.0"
description = "Evidence-led bilingual news and learning engine"
requires-python = ">=3.12"
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "dnspython>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3",
]

[project.scripts]
sngso-sqlite-export-manifest = "sngso_engine.sqlite_export:main"
sngso-schema-v36-dry-run = "sngso_engine.postgres_reconciliation_cli:main"
sngso-schema-v36-row-dry-run = "sngso_engine.postgres_row_dry_run:main"
sngso-sqlite-audit-checkpoint = "sngso_engine.audit_checkpoint_cli:main"
sngso-schema-v36-import-preflight = "sngso_engine.postgres_import_preflight_cli:main"
sngso-schema-v36-mapping-skeleton = "sngso_engine.postgres_mapping_skeleton_cli:main"

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
test = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sngso_engine.postgres_migrations" = ["*.sql"]
