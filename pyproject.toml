[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "new-sngso-engine"
version = "0.1.0"
description = "Evidence-led bilingual news and learning engine"
requires-python = ">=3.12"
dependencies = [
  "jsonschema[format]>=4.23,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
